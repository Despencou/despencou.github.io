<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Despencou - Promoções Exclusivas</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

  <link rel="icon" type="image/png" href="logo.png">

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background-color: #f8f8f8;
      margin: 0;
      padding: 0;
      text-align: center;
      color: #222;
    }

    .container {
      max-width: 420px;
      margin: 60px auto;
      padding: 40px 20px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.05);
    }

    .logo {
      width: 120px;
      border: 4px solid #e30613;
      border-radius: 50%;
      padding: 10px;
      background: #fff;
    }

    h1 {
      font-size: 1.7rem;
      margin-top: 25px;
      margin-bottom: 15px;
    }

    p {
      color: #444;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    .countdown {
      font-size: 2.2rem;
      font-weight: 700;
      color: #25D366;
      margin-bottom: 25px;
    }

    .button {
      display: inline-block;
      background: #25D366;
      color: white;
      text-decoration: none;
      padding: 15px 24px;
      border-radius: 12px;
      font-weight: 600;
      transition: 0.2s;
    }

    .button:hover {
      opacity: 0.9;
    }

    .stores {
      display: flex;
      justify-content: center;
      gap: 18px;
      margin-top: 35px;
    }

    .stores img {
      width: 42px;
    }

    footer {
      margin-top: 25px;
      color: #666;
      font-size: 0.9rem;
    }
  </style>
</head>

<body>

  <div class="container">

    <img src="logo.png" alt="Despencou" class="logo">

    <h1>CHEGA DE PAGAR MAIS CARO</h1>

    <p>
      Você está sendo direcionado para o grupo oficial de promoções.<br>
      Aguarde alguns segundos...
    </p>

    <div class="countdown" id="count">5</div>

    <a
      href="https://chat.whatsapp.com/Fuf1CMjvycwK7P695VPTof?mode=wwt"
      class="button"
      target="_blank"
    >
      Entrar agora
    </a>

    <div class="stores">
      <img src="amazon.png">
      <img src="mercadolivre.png">
      <img src="shopee.png">
    </div>

    <footer>
      Promoções reais das principais lojas
    </footer>

  </div>

  <script>
    let seconds = 5;

    const counter = document.getElementById("count");

    const interval = setInterval(() => {
      seconds--;

      counter.innerText = seconds;

      if (seconds <= 0) {
        clearInterval(interval);

        window.location.href =
          "https://chat.whatsapp.com/Fuf1CMjvycwK7P695VPTof?mode=wwt";
      }
    }, 1000);
  </script>

</body>
</html>
