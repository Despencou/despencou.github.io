<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Despencou</title>

  <style>
    body {
      margin: 0;
      background: #ffffff;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
      color: #111;
      padding: 20px;
    }

    .box {
      max-width: 340px;
    }

    img {
      width: 90px;
      border-radius: 50%;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 10px;
    }

    p {
      color: #555;
      line-height: 1.5;
    }

    .loader {
      width: 42px;
      height: 42px;
      border: 4px solid #ddd;
      border-top: 4px solid #25D366;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 24px auto 0;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>

  <div class="box">
    <img src="/logo.png" alt="Despencou">

    <h1>Entrando no grupo...</h1>

    <p>
      Aguarde alguns segundos enquanto conectamos você às promoções exclusivas.
    </p>

    <div class="loader"></div>
  </div>

  <script>
    setTimeout(function () {
      window.location.href = "https://chat.whatsapp.com/Fuf1CMjvycwK7P695VPTof?mode=wwt";
    }, 4000);
  </script>

</body>
</html>
