<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Despencou - Promoções Exclusivas</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="logo.png">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background-color: #f8f8f8;
      margin: 0;
      padding: 0;
      text-align: center;
      color: #222;
    }
    .container {
      max-width: 420px;
      margin: 60px auto;
      padding: 40px 20px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.05);
    }
    .logo {
      width: 120px;
      border: 4px solid #e30613;
      border-radius: 50%;
      padding: 10px;
      background: #fff;
    }
    h1 {
      font-size: 1.7rem;
      margin-top: 25px;
      margin-bottom: 15px;
    }
    p {
      color: #444;
      line-height: 1.6;
      margin-bottom: 25px;
    }
    .countdown {
      font-size: 2.2rem;
      font-weight: 700;
      color: #e30613;
      margin-bottom: 25px;
    }
    .button {
      display: inline-block;
      background: #e30613;
      color: white;
      text-decoration: none;
      padding: 15px 24px;
      border-radius: 12px;
      font-weight: 600;
      transition: 0.2s;
      cursor: pointer;
      border: none;
      font-size: 1rem;
      font-family: 'Poppins', sans-serif;
    }
    .button:hover {
      opacity: 0.9;
    }
    .stores {
      display: flex;
      justify-content: center;
      gap: 18px;
      margin-top: 35px;
    }
    .stores img {
      width: 42px;
    }
    footer {
      margin-top: 25px;
      color: #666;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="logo.png" alt="Despencou" class="logo">
    <h1>CHEGA DE PAGAR MAIS CARO</h1>
    <p>
      Receba as melhores promoções do dia direto no seu celular.<br>
      Aguarde alguns segundos...
    </p>
    <div class="countdown" id="count">5</div>
    <button class="button" onclick="ir()">
      Quero economizar agora
    </button>
    <div class="stores">
      <img src="amazon.png" alt="Amazon">
      <img src="mercadolivre.png" alt="Mercado Livre">
      <img src="shopee.png" alt="Shopee">
    </div>
    <footer>
      Promoções reais das principais lojas
    </footer>
  </div>
  <script>
    // Link do grupo codificado em base64 para não aparecer diretamente no HTML
    const dest = atob("aHR0cHM6Ly9jaGF0LndoYXRzYXBwLmNvbS9GdWYxQ01qdnljd0s3UDY5NVZQVm9mP21vZGU9d3d0");

    let seconds = 5;
    const counter = document.getElementById("count");
    const interval = setInterval(() => {
      seconds--;
      counter.innerText = seconds;
      if (seconds <= 0) {
        clearInterval(interval);
        ir();
      }
    }, 1000);

    function ir() {
      window.location.href = dest;
    }
  </script>
</body>
</html>
